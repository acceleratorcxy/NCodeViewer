[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nc-viewer"
version = "1.1.0"
description = "NC 代码刀路可视化查看器：按 F 值着色、行定位、多文件、搜索"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0,<9"]

[project.scripts]
nc-viewer = "nc_viewer.viewer:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"